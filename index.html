function kompres(f,maks){return new Promise((ok,no)=>{if(!/^image\/(jpeg|png|webp)$/.test(f.type))return no(new Error('Pilih berkas gambar (JPG, PNG, atau WebP).'));
 const u=URL.createObjectURL(f),im=new Image();
 im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,maks/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
  c.toBlob(b=>{if(!b)return no(new Error('Gagal memproses gambar.'));const r=new FileReader();r.onload=()=>ok({mime:'image/jpeg',b64:String(r.result).split(',')[1]});r.readAsDataURL(b)},'image/jpeg',.84)}catch(e){no(new Error('Gagal memproses gambar.'))}};
 im.onerror=()=>no(new Error('Gambar tidak dapat dibaca. Coba foto lain.'));im.src=u})}

 box.innerHTML=`<div class="card w"><h2>Foto banner utama</h2><p class="hint2">Foto besar di bagian atas beranda.</p><div class="hrow"><img src="${esc(g.hero&&g.hero.url?g.hero.url:FOTO)}" alt="Banner saat ini"><div><input type="file" id="hfile" accept="image/jpeg,image/png,image/webp"><p style="margin:10px 0"><button type="button" class="btn s g ghero">Ganti foto banner</button> ${g.hero?'<button type="button" class="btn s ghdel">Kembalikan foto bawaan</button>':''}</p></div></div></div>`
 +gal('kegiatan','Galeri kegiatan','Foto kegiatan santri. Urutan ditentukan tombol panah, dan keterangan tampil di bawah foto.')+gal('fasilitas','Galeri fasilitas','Foto sarana dan prasarana pondok.')}

 ${T('gelombang','Gelombang pendaftaran',gel,14,'Pisahkan tiap gelombang dengan satu baris kosong. Baris pertama = nama, baris kedua = tanggal, baris berikutnya = poin keuntungan. Tebalkan dengan **teks**.')}

 </div><br><button class="btn g" id="kts">Simpan teks</button> <button type="button" class="btn s" id="ktr">Kembalikan teks bawaan</button></form>

 gmRender();

 const kirimTeks=async t=>{const o=await run('simpanKonten',S.token,t);pakaiKonten({teks:o,gambar:K.gambar});cacheKonten()};

   kontak:ln('kontak').map(x=>{const p=x.split('|');return p.length>1?{label:p[0].trim(),nomor:p.slice(1).join('|').trim()}:{label:'WhatsApp',nomor:x}}),
   gelombang:bl('gelombang').map(q=>({nama:q[0],tanggal:q[1]||'',poin:q.slice(2)})),faq:bl('faq').map(q=>({q:q[0],a:q.slice(1).join(' ')}))};

 $('#ktr').onclick=async()=>{if(!confirm('Kembalikan semua teks beranda ke bawaan? Foto tidak terpengaruh.'))return;try{await kirimTeks({});kelolaView();say('Teks beranda dikembalikan ke bawaan.')}catch(x){say(x.message,true)}};

  try{
   if(b.classList.contains('gtam')){const f=ad.querySelector('.gfile').files[0];if(!f)return say('Pilih foto terlebih dahulu.',true);
    if(!(K.gambar[sl]||[]).length&&!confirm('Foto bawaan akan diganti dengan foto yang Anda kelola. Lanjutkan?'))return;
    b.disabled=true;say('Memproses foto…');const z=await kompres(f,1280);say('Mengunggah…');simpanG(await run('unggahGambar',S.token,sl,ad.querySelector('.gnew').value,z.mime,z.b64));say('Foto ditambahkan.')}
   else if(b.classList.contains('ghero')){const f=$('#hfile').files[0];if(!f)return say('Pilih foto banner terlebih dahulu.',true);
    b.disabled=true;say('Memproses foto…');const z=await kompres(f,1400);say('Mengunggah…');simpanG(await run('unggahGambar',S.token,'hero','',z.mime,z.b64));say('Foto banner diganti.')}
   else if(b.classList.contains('ghdel')){if(!confirm('Kembalikan foto banner ke bawaan?'))return;simpanG(await run('kelolaGambar',S.token,'hapusHero','hero','',''));say('Foto banner dikembalikan ke bawaan.')}
   else if(b.classList.contains('gdel')){if(!confirm('Hapus foto ini dari galeri?'))return;simpanG(await run('kelolaGambar',S.token,'hapus',sl,gi.dataset.id,''));say('Foto dihapus.')}
   else if(b.classList.contains('gup')||b.classList.contains('gdn')){simpanG(await run('kelolaGambar',S.token,b.classList.contains('gup')?'naik':'turun',sl,gi.dataset.id,''))}
   else if(b.classList.contains('gimp')){b.disabled=true;await imporBawaan(sl)}
  }catch(x){say(x.message,true);b.disabled=false}};
 box.onchange=async e=>{const t=e.target;if(t.classList.contains('gcap')){const gi=t.closest('.gi');try{K.gambar=await run('kelolaGambar',S.token,'caption',gi.dataset.slot,gi.dataset.id,t.value);cacheKonten();say('Keterangan tersimpan.')}catch(x){say(x.message,true)}}};

const b64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>no(new Error('Gagal membaca berkas.'));r.readAsDataURL(f)});

function bkRender(r){const box=$('#bk'),by={};r.docs.forEach(x=>by[x.jenis]=x);
 box.innerHTML=r.jenis.map(([j,w])=>{const x=by[j];return `<div class="bk" data-j="${esc(j)}"><div><b>${esc(j)}${w?' *':''}</b><br><span style="font-size:13px;color:var(--mute)">${x?esc(x.nama):'Belum diunggah'}${j==='Foto Calon Santri'?' · pas foto 3x4, wajah terlihat jelas':''}</span></div><div>${x?pill(x.status)+` <button class="btn s g lh" data-id="${esc(x.id)}" type="button">Lihat</button>`:''}<div class="pv"></div></div><div><input type="file" class="fl" accept="${j==='Foto Calon Santri'?'.jpg,.jpeg,.png,image/jpeg,image/png':'.pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png'}" aria-label="Pilih berkas ${esc(j)}"></div></div>`}).join('');
 box.querySelectorAll('.fl').forEach(i=>i.onchange=()=>bkUp(i));
 box.querySelectorAll('.lh').forEach(b=>b.onclick=()=>bkView(b.dataset.id,b.closest('.bk').querySelector('.pv')));const fd=by['Foto Calon Santri'];if(fd)fotoShow(fd.id)}
async function bkUp(i){const f=i.files[0];if(!f)return;const row=i.closest('.bk'),pv=row.querySelector('.pv');
 if(!['application/pdf','image/jpeg','image/png'].includes(f.type)){i.value='';return say('Format harus PDF, JPG, atau PNG.',true)}
 if(row.dataset.j==='Foto Calon Santri'&&f.type==='application/pdf'){i.value='';return say('Foto calon santri harus berformat JPG atau PNG.',true)}
 if(f.size>2*1024*1024){i.value='';return say('Ukuran berkas maksimal 2 MB.',true)}
 pv.innerHTML=f.type==='application/pdf'?`<span style="font-size:13px">${esc(f.name)}</span>`:`<img alt="Pratinjau" src="${URL.createObjectURL(f)}">`;
 i.disabled=true;say('Mengunggah…');
 try{const r=await run('uploadBerkas',S.token,row.dataset.j,f.name,f.type,await b64(f));say('Berkas tersimpan.');bkRender(r)}catch(x){say(x.message,true);i.disabled=false}}
async function bkView(id,pv,fn='lihatBerkas'){pv.textContent='Memuat…';try{const r=await run(fn,S.token,id);

 pv.innerHTML=r.mime==='application/pdf'?`<a href="${url}" target="_blank" rel="noopener">Buka PDF</a>`:`<img alt="Berkas" src="${url}">`}catch(x){pv.textContent=x.message}}

 $('#csv').onclick=async()=>{const H=Object.keys(D[0]||{});const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const b=new Blob(['\ufeff'+[H.map(q).join(',')].concat(D.map(x=>H.map(h=>q(x[h])).join(','))).join('\n')],{type:'text/csv'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='pendaftar-psb.csv';l.click()}}

function umum(){A.innerHTML=`<div class="wrap"><form class="card" id="f"><h2>Pengumuman hasil seleksi</h2><br><label for="q">Nomor pendaftaran, NIK, atau nama lengkap</label><input id="q" required><br><br>
 <button class="btn g" id="go">Cek hasil</button><div class="msg" id="msg" role="alert"></div><div id="res"></div></form></div>`;
 $('#f').onsubmit=async e=>{e.preventDefault();$('#go').disabled=true;say('Mencari…');$('#res').innerHTML='';
  try{const r=await run('cariPengumuman',$('#q').value);say('');$('#res').innerHTML=r?`<div style="border-left:3px solid var(--gold);padding:8px 16px;margin-top:8px"><b>${esc(r.nama)}</b><br>${esc(r.no)}<br>${esc(r.program)}<br>Status: <span class="pill">${esc(r.status)}</span></div>`:'<p>Data tidak ditemukan. Periksa kembali penulisannya.</p>'}catch(x){say(x.message,true)}$('#go').disabled=false}}

function route(){navi();const h=location.hash.replace('#/','');document.body.dataset.v=h;scrollTo(0,0);
 if(h.startsWith('cek/'))return cekView(decodeURIComponent(h.slice(4)));
 ({'':home,masuk:()=>authView('masuk'),daftar:()=>authView('daftar'),dashboard:dash,panel:panel,pengumuman:umum,akun:akunView,pembayaran:bayarView,lupa:lupaView,kelola:kelolaView}[h]||home)()}
addEventListener('hashchange',route);
(function(){let c=null;try{c=JSON.parse(localStorage.getItem('psb_konten'))}catch(e){}if(c)pakaiKonten(c)})();
renderFooter();route();
run('kontenBeranda').then(r=>{pakaiKonten(r);cacheKonten();if(/^#?\/?$/.test(location.hash))home()}).catch(()=>{});
</script></body></html>
